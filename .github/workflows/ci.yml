name: CI

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: booking
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_DATABASE: booking
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, zip, bcmath, intl, gd
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Composer install (update on upgrade-* branches)
        run: |
          if [[ "$GITHUB_REF_NAME" == upgrade-* ]]; then
            composer update -W --no-interaction --prefer-dist
          else
            composer install --no-interaction --prefer-dist
          fi
      - if: startsWith(github.ref_name, 'upgrade-')
        uses: actions/upload-artifact@v4
        with:
          name: composer-lock
          path: composer.lock
      - run: php artisan --version
      - run: cp .env.example .env && php artisan key:generate
      - name: Compile Blade views
        run: php artisan view:cache
      - name: Build frontend
        run: npm install && npm run build
      - name: Tests
        run: php artisan test
      - name: Production caches build (config, routes, events)
        run: php artisan config:cache && php artisan route:cache && php artisan event:cache && php artisan optimize:clear
      - name: Database backup works
        run: php artisan migrate --force && php artisan backup:database && ls -la storage/app/backups
